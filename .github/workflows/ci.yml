# Compile le projet et lance les tests à chaque pull request et à chaque push sur main
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    # Base PostgreSQL temporaire, détruite à la fin du job
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: suivicandidatures
          POSTGRES_USER: suivicandidatures
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Remplacent le fichier .env, qui n'existe pas sur GitHub
    env:
      DB_NAME: suivicandidatures
      DB_USER: suivicandidatures
      DB_PASSWORD: ci

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build