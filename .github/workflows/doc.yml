name: Dossier PDF

# Vérifie à chaque modification de doc/ que le dossier se compile,
# et met le PDF à disposition dans l'onglet Actions (rubrique « Artifacts »).
# Au moment d'un rendu, on télécharge ce PDF et on le commite dans doc/ (voir CONTRIBUTING.md).
on:
  push:
    paths: ['doc/**', '.github/workflows/doc.yml']
  pull_request:
    paths: ['doc/**', '.github/workflows/doc.yml']
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installation de pandoc, WeasyPrint et PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 graphviz fonts-inter
          pip install weasyprint
          curl -sSL -o doc/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.4/plantuml-1.2025.4.jar

      - name: Compilation du dossier
        run: make -B -C doc

      - uses: actions/upload-artifact@v6
        with:
          name: dossier
          path: doc/dossier.pdf
