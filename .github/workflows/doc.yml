name: Dossier PDF

# À chaque push sur une branche de travail qui modifie doc/, compile doc/dossier.md en PDF
# et commite doc/dossier.pdf dans cette même branche. Le PDF arrive ainsi sur main avec la pull request.
# (Les pushs faits par ce workflow ne relancent pas de workflow : pas de boucle.)
on:
  push:
    branches-ignore: [main]          # main est protégée : tout passe par une pull request
    paths:
      - 'doc/**'
      - '!doc/dossier.pdf'
      - '.github/workflows/doc.yml'
  workflow_dispatch:

permissions:
  contents: write                    # nécessaire pour commiter le PDF

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installation de pandoc, WeasyPrint et PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangoft2-1.0-0 graphviz fonts-inter
          pip install weasyprint
          curl -sSL -o doc/plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2025.4/plantuml-1.2025.4.jar

      - name: Compilation du dossier
        run: make -B -C doc

      - name: Commit du PDF dans la branche
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/dossier.pdf
          git diff --cached --quiet || { git commit -m "docs: régénère le PDF du dossier"; git push; }
