spring.application.name=suivi-candidatures

# Lit les variables du fichier .env (s'il existe) : les mêmes que pour Docker Compose
spring.config.import=optional:file:.env[.properties]

# Connexion à la base PostgreSQL lancée par docker compose
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Les tables sont créées uniquement par Flyway ; Hibernate vérifie seulement qu'elles correspondent au code
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# État de l'application : http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health