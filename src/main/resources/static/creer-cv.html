<script type="module">
import { nouveauCv, lireCv, creerCv, enregistrerCv, telechargerPdf } from "./cv-api.js";
import { brancherImport } from "./cv-import.js";
import { MODELES, POLICES, COULEURS, TAILLES, reglages, PERMIS, ETAPES, afficherCv, evaluerCv, sectionRemplie, normaliserContenu, nomComplet, echapper, periode, formaterDate } from "./cv-rendu.js";

const NIVEAUX = ["Langue maternelle", "C2", "C1", "B2", "B1", "A2", "A1"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const VIDES = {
	liens: { libelle: "", url: "" },
	competences: { groupe: "", elements: [] },
	experiences: { poste: "", entreprise: "", lieu: "", debut: "", fin: "", enCours: false, description: "", realisations: [] },
	formations: { diplome: "", etablissement: "", mention: "", debut: "", fin: "", enCours: false, description: "" },
	projets: { titre: "", lien: "", description: "" },
	langues: { langue: "", niveau: "" },
	certifications: { nom: "", organisme: "", date: "", lien: "" },
};
const LISTES_EDITEES = ["experiences", "formations", "projets", "certifications"];
const $ = selecteur => document.querySelector(selecteur);
const rempli = valeur => String(valeur ?? "").trim() !== "";
const CORBEILLE = `<svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;

const etat = {
	cv: nouveauCv(),
	etape: 0,
	ouvert: { experiences: null, formations: null, projets: null, certifications: null },
	erreurs: {},
	descriptions: new Set(), // expériences dont la zone « Description » est ouverte
};
let minuteur;

// ----- Utilitaires -----

function notifier(message) {
	const zone = $("[data-notification]");
	zone.textContent = message;
	zone.hidden = false;
	clearTimeout(minuteur);
	minuteur = setTimeout(() => { zone.hidden = true; }, 5000);
}

function lire(chemin) {
	return chemin.split(".").reduce((objet, cle) => objet?.[cle], etat.cv);
}

function ecrire(chemin, valeur) {
	const cles = chemin.split(".");
	const derniere = cles.pop();
	cles.reduce((objet, cle) => objet[cle], etat.cv)[derniere] = valeur;
}

function fermerEditeurs() {
	LISTES_EDITEES.forEach(cle => { etat.ouvert[cle] = null; });
	etat.descriptions.clear();
}

function champ(libelle, chemin, { type = "text", obligatoire = false, aide = "", desactive = false } = {}) {
	const valeur = echapper(lire(chemin));
	const erreur = etat.erreurs[chemin];
	const attributs = `data-chemin="${chemin}"${obligatoire ? " required" : ""}${erreur ? ' aria-invalid="true"' : ""}${aide ? ` placeholder="${echapper(aide)}"` : ""}${desactive ? " disabled" : ""}`;
	const saisie = type === "textarea"
		? `<textarea ${attributs}>${valeur}</textarea>`
		: `<input type="${type}" ${attributs} value="${valeur}">`;
	return `<label class="champ"><span>${libelle}${obligatoire ? " *" : ""}</span>${saisie}${erreur ? `<p class="erreur">${erreur}</p>` : ""}</label>`;
}

// Liste de textes saisie dans une zone de texte, un élément par ligne.
function champLignes(libelle, chemin, aide) {
	const valeur = echapper((lire(chemin) ?? []).join("\n"));
	return `<label class="champ"><span>${libelle}</span><textarea data-lignes="${chemin}" placeholder="${echapper(aide)}">${valeur}</textarea></label>`;
}

// Date « mois + année » enregistrée « AAAA » ou « AAAA-MM ».
function decouperDate(valeur) {
	const texte = String(valeur ?? "").trim();
	let m = texte.match(/^(\d{4})(?:-(\d{2}))?$/);
	if (m) return { annee: m[1], mois: m[2] ?? "" };
	m = texte.match(/^(\d{1,2})\/(\d{4})$/);
	if (m) return { annee: m[2], mois: m[1].padStart(2, "0") };
	m = texte.match(/^(\d{4})/);
	return { annee: m ? m[1] : "", mois: "" };
}

function champDate(libelle, chemin, { desactive = false } = {}) {
	const { annee, mois } = decouperDate(lire(chemin));
	const options = `<option value="">Mois</option>` + MOIS.map((nom, i) => {
		const valeur = String(i + 1).padStart(2, "0");
		return `<option value="${valeur}"${valeur === mois ? " selected" : ""}>${nom}</option>`;
	}).join("");
	const attente = desactive ? " disabled" : "";
	return `<div class="champ"><span>${libelle}</span><div class="date">
<select data-date-mois="${chemin}" aria-label="${libelle} : mois"${attente}>${options}</select>
<input data-date-annee="${chemin}" value="${echapper(annee)}" inputmode="numeric" maxlength="4" placeholder="AAAA" aria-label="${libelle} : année"${attente}></div></div>`;
}

function caseACocher(libelle, chemin) {
	return `<label class="case"><input type="checkbox" data-coche="${chemin}"${lire(chemin) ? " checked" : ""}> ${libelle}</label>`;
}

// Petite corbeille : « action » vaut « supprimer » (retire un élément d'une liste) ou « effacer » (vide un champ).
function corbeille(chemin, libelle, action = "supprimer") {
	return `<button type="button" class="corbeille" data-${action}="${chemin}" aria-label="${libelle}" title="${libelle}">${CORBEILLE}</button>`;
}

function boutonAjouter(chemin, texte) {
	return `<button type="button" class="lien" data-ajouter="${chemin}">+ ${texte}</button>`;
}

function resume(liste, index, titre, detail) {
	return `<div class="resume"><div style="min-width:0"><strong>${titre}</strong><span>${detail}</span></div>
<div class="resume-actions"><button type="button" class="bouton bouton-petit" data-ouvrir="${liste}.${index}">Modifier</button>
${corbeille(`contenu.${liste}.${index}`, "Supprimer")}</div></div>`;
}

// Liste d'éléments repliés en résumés, avec un seul élément ouvert à la fois.
function listeEditee(cle, { titre, detail, editeur, ajouter }) {
	const liste = etat.cv.contenu[cle];
	const ouvert = etat.ouvert[cle];
	const resumes = liste.map((element, i) => i === ouvert ? "" : resume(cle, i, echapper(titre(element)), echapper(detail(element)))).join("");
	const edition = ouvert !== null && liste[ouvert]
		? `<div class="editeur">${editeur(`contenu.${cle}.${ouvert}`, liste[ouvert])}
<button type="button" class="bouton bouton-petit" style="align-self:flex-start" data-fermer>Fermer</button></div>`
		: "";
	return resumes + edition + boutonAjouter(`contenu.${cle}`, ajouter);
}

// Même ordre que ETAPES et que les sections du CV.
const PANNEAUX = [panneauProfil, panneauCompetences, panneauExperiences, panneauProjets, panneauFormations, panneauCertifications, panneauLangues, panneauVerification];

// ----- Affichage -----

function afficherPanneau({ focus } = {}) {
	$("[data-panneau]").innerHTML = PANNEAUX[etat.etape]();
	afficherEtapes();
	const precedent = $("[data-precedent]");
	precedent.hidden = etat.etape === 0;
	precedent.textContent = etat.etape > 0 ? `← ${ETAPES[etat.etape - 1]}` : "";
	$("[data-suivant]").textContent = etat.etape < ETAPES.length - 1 ? `${ETAPES[etat.etape + 1]} →` : "Terminer";
	if (focus) $(`[data-panneau] ${focus}`)?.focus();
}

// Barre de progression : vert = section remplie, bleu = étape en cours, gris = vide.
// Pastilles : coche verte = section remplie, cercle vide = à compléter, fond foncé = étape en cours.
function afficherEtapes() {
	const derniere = ETAPES.length - 1;
	let remplies = 0;
	const items = ETAPES.map((nom, i) => {
		const remplie = i < derniere && sectionRemplie(etat.cv.contenu, i);
		if (remplie) remplies += 1;
		const marque = i === derniere ? "" : remplie ? `<span class="fait"><svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></span>` : `<span class="rond" aria-hidden="true"></span>`;
		const classe = remplie ? ' class="remplie"' : "";
		const courante = i === etat.etape ? ' aria-current="step"' : "";
		const titre = i === derniere ? "" : remplie ? " (remplie)" : " (à compléter)";
		return `<li${classe}${courante}><button type="button" data-aller="${i}" title="${nom}${titre}">${marque}${nom}</button></li>`;
	}).join("");
	$("[data-etapes]").innerHTML = items + `<li class="compteur">${remplies}/${derniere}</li>`;
}

// ----- Barre de réglages de l'aperçu : Modèle, Couleur, Police, Taille, Langue -----

const LANGUES = { FR: { nom: "Français" }, EN: { nom: "Anglais" } };
const CHEVRON = `<svg aria-hidden="true" viewBox="0 0 12 8" width="11" height="8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5l5 5 5-5"/></svg>`;
const SERIF = ["EB_GARAMOND", "LORA", "SOURCE_SERIF_4"];

function optionsReglage(cle, choisi) {
	const option = (valeur, contenu) => `<button type="button" role="menuitemradio" aria-checked="${valeur === choisi}" data-reglage="${cle}" data-valeur="${valeur}">${contenu}</button>`;
	switch (cle) {
		case "couleur":
			return Object.entries(COULEURS).map(([v, x]) => option(v, `<span class="nuancier" style="background:${x.titres}" aria-hidden="true"></span>${x.nom}`)).join("");
		case "police": {
			const groupe = (titre, filtre) => `<p class="menu-titre">${titre}</p>` + Object.entries(POLICES).filter(([v]) => filtre(v))
				.map(([v, x]) => option(v, `<span style="font-family:${x.css}">${x.nom}</span>`)).join("");
			return groupe("Sans empattement", v => !SERIF.includes(v)) + groupe("Avec empattement", v => SERIF.includes(v));
		}
		default: {
			const liste = { modele: MODELES, taille: TAILLES, langue: LANGUES }[cle];
			return Object.entries(liste).map(([v, x]) => option(v, x.nom)).join("");
		}
	}
}

function afficherOutils() {
	const r = { ...reglages(etat.cv), langue: etat.cv.langue === "EN" ? "EN" : "FR" };
	const boutons = [["modele", "Modèle"], ["couleur", "Couleur"], ["police", "Police"], ["taille", "Taille"], ["langue", r.langue]];
	$("[data-reglages]").innerHTML = boutons.map(([cle, libelle]) => `<div class="reglage">
<button type="button" class="pastille" data-menu="${cle}" aria-haspopup="true" aria-expanded="false">${libelle}${CHEVRON}</button>
<div class="menu-reglage" role="menu" aria-label="${libelle}" hidden>${optionsReglage(cle, r[cle])}</div></div>`).join("");
	const colonnes = MODELES[r.modele].colonnes;
	const ats = $("[data-ats]");
	ats.textContent = colonnes ? "Moins sûr pour les ATS" : "Compatible ATS";
	ats.title = colonnes
		? "Deux colonnes. ATS : logiciels de tri des candidatures. Certains lisent mal deux colonnes ; préférez une colonne pour les candidatures en ligne."
		: "Une colonne. ATS : logiciels de tri des candidatures. Une colonne est lue dans le bon ordre.";
	ats.classList.toggle("attention", Boolean(colonnes));
}

function fermerMenus(sauf) {
	document.querySelectorAll("[data-menu]").forEach(bouton => {
		if (bouton === sauf) return;
		bouton.setAttribute("aria-expanded", "false");
		bouton.nextElementSibling.hidden = true;
	});
}

// Changer de modèle remet sa police et sa couleur par défaut ; elles restent modifiables ensuite.
function appliquerReglage(cle, valeur) {
	if (cle === "modele") {
		etat.cv.modele = valeur;
		etat.cv.police = MODELES[valeur].police;
		etat.cv.couleur = MODELES[valeur].couleur;
	} else {
		etat.cv[cle] = valeur;
	}
	afficherOutils();
	afficherApercu();
}

function afficherApercu() {
	afficherCv($("[data-feuille] article"), etat.cv);
	ajusterEchelle();
}

function ajusterEchelle() {
	const cadre = $("[data-cadre]");
	const feuille = $("[data-feuille]");
	const echelle = Math.min(1, cadre.clientWidth / 794);
	feuille.style.transform = `scale(${echelle})`;
	feuille.style.left = `${Math.max(0, (cadre.clientWidth - 794 * echelle) / 2)}px`;
	cadre.style.height = `${Math.ceil(feuille.offsetHeight * echelle)}px`;
}

function afficherEnTete() {
	const titre = etat.cv.titre?.trim();
	$("[data-titre-page]").textContent = etat.cv.id ? "Modifier le CV" : "Créer un CV";
	$("[data-fil]").textContent = etat.cv.id && titre ? titre : "Nouveau CV";
	document.title = `${etat.cv.id ? "Modifier le CV" : "Créer un CV"} · Suivi Candidatures`;
}

// ----- Enregistrement -----

function verifierObligatoires() {
	etat.erreurs = {};
	if (!etat.cv.titre?.trim()) etat.erreurs.titre = "Donnez un titre à ce CV, par exemple « Data engineer ».";
	if (!etat.cv.contenu.identite.prenom?.trim()) etat.erreurs["contenu.identite.prenom"] = "Le prénom est obligatoire.";
	if (!etat.cv.contenu.identite.nom?.trim()) etat.erreurs["contenu.identite.nom"] = "Le nom est obligatoire.";
	return Object.keys(etat.erreurs).length === 0;
}

async function enregistrer({ silencieux = false } = {}) {
	if (!verifierObligatoires()) {
		etat.etape = 0;
		afficherPanneau({ focus: "[aria-invalid=true]" });
		notifier("Le titre du CV, le prénom et le nom sont obligatoires.");
		return false;
	}
	try {
		if (etat.cv.id) {
			etat.cv = await enregistrerCv(etat.cv);
		} else {
			etat.cv = await creerCv(etat.cv);
			history.replaceState(null, "", `?id=${etat.cv.id}`);
		}
		etat.cv.contenu = normaliserContenu(etat.cv.contenu);
		afficherEnTete();
		const heure = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
		$("[data-statut]").textContent = `Enregistré à ${heure}`;
		if (!silencieux) notifier("Brouillon enregistré.");
		return true;
	} catch (erreur) {
		notifier(erreur.message || "L'enregistrement a échoué. Réessayez.");
		return false;
	}
}

// ----- Événements -----

function apresModification() {
	afficherApercu();
	afficherEtapes();
}

document.addEventListener("input", evenement => {
	const cible = evenement.target;
	const d = cible.dataset;
	if (d.chemin && cible.type !== "checkbox") {
		ecrire(d.chemin, cible.value);
		if (etat.erreurs[d.chemin] && cible.value.trim()) {
			delete etat.erreurs[d.chemin];
			cible.removeAttribute("aria-invalid");
			cible.parentElement.querySelector(".erreur")?.remove();
		}
	} else if (d.virgules) {
		ecrire(d.virgules, cible.value.split(",").map(t => t.trim()).filter(Boolean));
	} else if (d.lignes) {
		ecrire(d.lignes, cible.value.split("\n").map(t => t.trim()).filter(Boolean));
	} else if (d.dateAnnee || d.dateMois) {
		const chemin = d.dateAnnee || d.dateMois;
		const annee = document.querySelector(`[data-date-annee="${chemin}"]`).value.trim();
		const mois = document.querySelector(`[data-date-mois="${chemin}"]`).value;
		ecrire(chemin, /^\d{4}$/.test(annee) ? (mois ? `${annee}-${mois}` : annee) : "");
	} else {
		return;
	}
	apresModification();
});

document.addEventListener("change", evenement => {
	const cible = evenement.target;
	if (cible.dataset.coche) {
		ecrire(cible.dataset.coche, cible.checked);
		afficherPanneau();
		apresModification();
	} else if (cible.tagName === "SELECT" && cible.dataset.chemin) {
		ecrire(cible.dataset.chemin, cible.value);
		apresModification();
	}
});

document.addEventListener("click", async evenement => {
	const bouton = evenement.target.closest("button");
	if (!bouton) return;
	const d = bouton.dataset;

	if (d.aller !== undefined) {
		etat.etape = Number(d.aller);
		fermerEditeurs();
		afficherPanneau();
	} else if (d.ajouter) {
		const liste = lire(d.ajouter);
		const cle = d.ajouter.split(".").pop();
		liste.push(cle === "realisations" ? "" : structuredClone(VIDES[cle]));
		if (cle in etat.ouvert) etat.ouvert[cle] = liste.length - 1;
		afficherPanneau({ focus: cle === "realisations" ? ".ligne-liste:last-of-type input" : ".editeur input, .rangee:last-of-type input" });
		apresModification();
	} else if (d.ouvrir) {
		const [liste, index] = d.ouvrir.split(".");
		etat.ouvert[liste] = Number(index);
		afficherPanneau({ focus: ".editeur input" });
	} else if (d.fermer !== undefined) {
		fermerEditeurs();
		afficherPanneau();
	} else if (d.supprimer) {
		const cles = d.supprimer.split(".");
		const index = Number(cles.pop());
		lire(cles.join(".")).splice(index, 1);
		const liste = cles[cles.length - 1];
		if (liste in etat.ouvert) etat.ouvert[liste] = null;
		etat.descriptions.clear();
		afficherPanneau();
		apresModification();
	} else if (d.ajouterDescription) {
		etat.descriptions.add(d.ajouterDescription);
		afficherPanneau({ focus: ".ligne-texte textarea" });
	} else if (d.effacer) {
		ecrire(d.effacer, "");
		etat.descriptions.delete(d.effacer.replace(/\.description$/, ""));
		afficherPanneau();
		apresModification();
	} else if (d.permis) {
		const permis = etat.cv.contenu.identite.permis;
		const position = permis.indexOf(d.permis);
		if (position >= 0) permis.splice(position, 1);
		else permis.splice(PERMIS.filter(p => permis.includes(p) || p === d.permis).indexOf(d.permis), 0, d.permis);
		bouton.setAttribute("aria-pressed", String(position < 0));
		apresModification();
	} else if (d.menu) {
		const ouvrir = bouton.getAttribute("aria-expanded") !== "true";
		fermerMenus(bouton);
		bouton.setAttribute("aria-expanded", String(ouvrir));
		bouton.nextElementSibling.hidden = !ouvrir;
		if (ouvrir) bouton.nextElementSibling.querySelector("[aria-checked=true]")?.focus();
	} else if (d.reglage) {
		appliquerReglage(d.reglage, d.valeur);
		$(`[data-menu="${d.reglage}"]`)?.focus();
	} else if (d.ameliorerIa !== undefined) {
		notifier("L'amélioration par l'IA sera branchée sur le module IA commun dans une prochaine étape.");
	} else if (d.pdf !== undefined) {
		bouton.disabled = true;
		try {
			if (await enregistrer({ silencieux: true })) {
				await telechargerPdf(etat.cv.id);
			}
		} catch (erreur) {
			notifier(erreur.message);
		} finally {
			bouton.disabled = false;
		}
	}
});

brancherImport({ champ: $("[data-fichier]"), depot: $("[data-depot]"), notifier });

document.addEventListener("click", evenement => {
	if (!evenement.target.closest(".reglage")) fermerMenus();
});
document.addEventListener("keydown", evenement => {
	if (evenement.key !== "Escape") return;
	const ouvert = document.querySelector("[data-menu][aria-expanded=true]");
	fermerMenus();
	ouvert?.focus();
});

$("[data-precedent]").addEventListener("click", () => {
	etat.etape = Math.max(0, etat.etape - 1);
	fermerEditeurs();
	afficherPanneau();
});

$("[data-brouillon]").addEventListener("click", () => enregistrer());

$("[data-suivant]").addEventListener("click", async () => {
	if (etat.etape === 0 && !verifierObligatoires()) {
		afficherPanneau({ focus: "[aria-invalid=true]" });
		return;
	}
	const ok = await enregistrer({ silencieux: true });
	if (!ok) return;
	if (etat.etape < ETAPES.length - 1) {
		etat.etape += 1;
		fermerEditeurs();
		afficherPanneau();
		window.scrollTo({ top: 0, behavior: "smooth" });
	} else {
		window.location.href = "mes-cv.html";
	}
});

if ("ResizeObserver" in window) new ResizeObserver(ajusterEchelle).observe($("[data-cadre]"));
window.addEventListener("resize", ajusterEchelle);
document.fonts?.ready.then(ajusterEchelle);

// ----- Démarrage -----

const parametres = new URLSearchParams(window.location.search);
const id = parametres.get("id");
// « ?etape=verification » ou « ?etape=3 » (lien « À compléter » de Mes CV) ouvre directement cette étape.
const etapeDemandee = parametres.get("etape");
if (etapeDemandee === "verification") etat.etape = ETAPES.length - 1;
else if (/^\d+$/.test(etapeDemandee ?? "") && Number(etapeDemandee) < ETAPES.length) etat.etape = Number(etapeDemandee);
if (id) {
	try {
		etat.cv = await lireCv(id);
	} catch (erreur) {
		notifier(`${erreur.message} Un nouveau CV a été ouvert.`);
		history.replaceState(null, "", window.location.pathname);
		etat.etape = 0;
	}
}
etat.cv.contenu = normaliserContenu(etat.cv.contenu);
afficherEnTete();
afficherOutils();
afficherPanneau();
afficherApercu();

</script>
</body>
</html>
