<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes CV · Suivi Candidatures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;color:#0f2a5c;background:#f1f6fd}
a{text-decoration:none;color:inherit}
a:hover{opacity:.88}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #0f2a5c;outline-offset:3px}
button{font-family:inherit}
[hidden]{display:none!important}
main.page>*{width:100%;max-width:1200px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.page-tete{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.page-tete h1{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:56px;line-height:1;letter-spacing:-.015em;color:#0f2a5c}
.page-tete p{margin:10px 0 0;max-width:560px;font-size:17px;color:#4a5f86}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 20px;border-radius:999px;border:1.5px solid #bcd3f5;background:#fff;color:#0f2a5c;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none}
.bouton:disabled{opacity:.5;cursor:default}
.bouton-principal{min-height:50px;padding:0 24px;border:0;background:#ffc933;font-size:15.5px;font-weight:700;box-shadow:0 8px 22px rgba(15,42,92,.14)}
.filtres{display:flex;flex-wrap:wrap;gap:10px}
.filtres button{min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid #bcd3f5;background:#fff;color:#0f2a5c;font-size:14.5px;font-weight:600;cursor:pointer}
.filtres button[aria-pressed="true"]{border-color:#0f2a5c;background:#0f2a5c;color:#fff}
.grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}
@media (max-width:1380px){.grille{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.grille{grid-template-columns:minmax(0,1fr)}}
.carte{position:relative;display:flex;flex-direction:column;gap:14px;min-width:0;padding:22px;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(15,42,92,.08)}
.carte-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.carte-tete h2{margin:0;font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.carte-tete .date{margin:4px 0 0;font-size:13.5px;color:#4a5f86}
.actions-page{display:flex;flex-wrap:wrap;gap:10px}
.actions-page .bouton{min-height:50px}
.progression{display:flex;flex-direction:column;gap:8px}
.progression-tete{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:14.5px}
.progression-tete span{color:#4a5f86}
.barre{height:8px;border-radius:999px;background:#e3edfc;overflow:hidden}
.barre span{display:block;height:100%;border-radius:inherit;background:#2a64cc}
.etat-complet{display:flex;align-items:center;gap:8px;margin:0;font-size:14.5px;font-weight:600;color:#14573f}
.etat-incomplet{margin:0;font-size:14px;line-height:1.5;color:#4a5f86}
.etat-incomplet a{color:#1d4fa8;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.miniature{display:block;position:relative;height:300px;overflow:hidden;border-radius:14px;border:1px solid #dbe6f7;background:#fff}
.miniature:hover{opacity:1;border-color:#9dbbea}
.miniature-page{position:absolute;top:0;left:0;width:794px;transform-origin:top left;pointer-events:none}
.miniature:after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff)}
.lien{padding:4px 0;border:0;background:transparent;color:#1d4fa8;font-size:14px;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.carte-actions{display:flex;flex-wrap:wrap;gap:10px;padding-top:14px;border-top:1px solid #e3edfc}
.menu{position:relative}
.bouton-menu{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#0f2a5c;font-size:20px;font-weight:700;line-height:1;cursor:pointer}
.bouton-menu:hover{background:#f1f6fd}
.menu-liste{position:absolute;right:0;top:44px;z-index:5;min-width:210px;padding:6px;border-radius:14px;background:#fff;box-shadow:0 12px 32px rgba(15,42,92,.18)}
.menu-liste button{display:block;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#0f2a5c;font-size:14.5px;font-weight:600;text-align:left;cursor:pointer}
.menu-liste button:hover{background:#f1f6fd}
.menu-liste .danger{color:#a02738}
.carte-nouveau{align-items:center;justify-content:center;text-align:center;box-sizing:border-box;border:2px dashed #9dbbea;background:rgba(255,255,255,.55);box-shadow:none}
.carte-nouveau p{margin:0;max-width:260px;font-size:14.5px;color:#4a5f86}
.carte-nouveau .actions-page{justify-content:center}
.carte-nouveau .actions-page .bouton{min-height:44px}
.bouton-bleu{border-color:#2a64cc;background:#2a64cc;color:#fff}
.accueil{display:flex;flex-direction:column;gap:24px;padding:36px;border-radius:24px;background:#fff;box-shadow:0 10px 30px rgba(15,42,92,.08)}
.accueil h2{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:34px;line-height:1.1}
.accueil>div>p{margin:8px 0 0;font-size:16px;color:#4a5f86}
.choix{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.choix-carte{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:24px;border-radius:18px;border:1.5px solid #d3e1f6;background:#f8fbff}
.choix-carte h3{margin:0;font-size:19px;font-weight:700}
.choix-carte p{margin:0 0 6px;font-size:14.5px;color:#4a5f86}
.choix-carte .bouton{margin-top:auto}
.icone{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;background:#e3edfc;color:#1d4fa8}
.depot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(15,42,92,.55);color:#fff;font-size:22px;font-weight:700;pointer-events:none}
.depot span{padding:28px 40px;border:3px dashed #fff;border-radius:24px}
.notification{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;max-width:min(560px,calc(100% - 32px));padding:12px 18px;border-radius:14px;background:#0f2a5c;color:#fff;font-size:14.5px;box-shadow:0 12px 32px rgba(15,42,92,.3)}
@media (max-width:700px){main.page{padding:28px 16px 48px!important}.page-tete h1{font-size:44px}}
</style>

<link rel="stylesheet" href="/cv-modeles.css">
<script type="module" src="/authentification.js"></script>
</head>
<body>
<div style="width:100%;min-height:100vh;box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:stretch;background:#f1f6fd;font-family:'Instrument Sans',system-ui,sans-serif;color:#0f2a5c;line-height:1.5">

<!-- ===== Menu latéral (identique sur tous les écrans) ===== -->
<aside style="flex:1 1 248px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:30px;padding:28px 20px;background:linear-gradient(180deg,#2a64cc 0%,#3672d6 72%,#5a8de0 100%);color:#fff">
<div aria-hidden="true" style="position:absolute;left:-90px;bottom:-60px;width:380px;height:190px;background:radial-gradient(closest-side,#fff 0%,rgba(255,255,255,.7) 45%,rgba(255,255,255,0) 100%);opacity:.35"></div>
<a href="tableau-de-bord.html" style="position:relative;display:flex;align-items:center;gap:10px;padding:0 6px;color:#fff;font-weight:700;font-size:19px;letter-spacing:-.01em">
<span style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#fff">
<svg aria-hidden="true" viewBox="0 0 120 70" style="width:22px"><path d="M2 38 L118 2 L82 68 L60 46 Z" fill="#2a64cc"/><path d="M2 38 L60 46 L118 2 Z" fill="#6f9ae6"/></svg>
</span>
<span>Suivi Candidatures</span>
</a>
<nav aria-label="Menu principal" style="position:relative;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="padding:0 18px 4px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e3edff">Recherche</div>
<a href="offres.html" style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 18px;border-radius:999px;color:#fff;font-size:15.5px;font-weight:500">Offres</a>
<a href="mes-candidatures.html" style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 18px;border-radius:999px;color:#fff;font-size:15.5px;font-weight:500">Mes candidatures</a>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<div style="padding:0 18px 4px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e3edff">Préparer</div>
<a href="mes-cv.html" aria-current="page" style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 18px;border-radius:999px;background:#fff;color:#0f2a5c;font-size:15.5px;font-weight:700;box-shadow:0 6px 18px rgba(15,42,92,.18)">Mes CV</a>
<a href="analyser-offre.html" style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 18px;border-radius:999px;color:#fff;font-size:15.5px;font-weight:500">Analyser une offre</a>
<a href="mes-lettres.html" style="display:flex;align-items:center;min-height:44px;box-sizing:border-box;padding:0 18px;border-radius:999px;color:#fff;font-size:15.5px;font-weight:500">Mes lettres</a>
</div>
</nav>
<div data-compte-candidat style="margin-top:auto;position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:#fff;color:#0f2a5c">
<span data-initiales-candidat aria-hidden="true" style="display:flex;align-items:center;justify-content:center;flex:0 0 38px;height:38px;border-radius:50%;background:#ffc933;font-size:14px;font-weight:700"></span>
<div style="min-width:0">
<div data-nom-candidat style="font-size:14.5px;font-weight:700;line-height:1.25;overflow-wrap:anywhere"></div>
<button type="button" data-deconnexion style="padding:0;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:#1d4fa8;text-decoration:underline;text-underline-offset:2px;cursor:pointer">Se déconnecter</button>
<p data-erreur-auth role="alert" hidden style="margin:4px 0 0;color:#a02738;font-size:12.5px"></p>
</div>
</div>
</aside>

<main class="page" style="flex:999 1 560px;min-width:0;box-sizing:border-box;padding:40px 44px 56px;display:flex;flex-direction:column;gap:24px;background:radial-gradient(520px 220px at 94% -4%,#fff 0%,rgba(255,255,255,0) 100%),linear-gradient(180deg,#d6e6fb 0%,#f1f6fd 300px)">

<div class="page-tete">
<div style="flex:1 1 380px;min-width:0">
<h1>Mes CV</h1>
<p>Créez plusieurs versions de votre CV, choisissez leur mise en page et téléchargez-les en PDF.</p>
</div>
<div class="actions-page" data-actions-page hidden><button type="button" class="bouton" data-importer>Importer un CV</button><a class="bouton bouton-principal" href="creer-cv.html">Créer un CV</a></div>
<input type="file" accept=".pdf,.docx" data-fichier hidden>
</div>

<div class="filtres" role="group" aria-label="Filtrer par langue" data-filtres hidden></div>

<div class="grille" data-grille></div>

</main>
<div class="notification" role="status" data-notification hidden></div>
<div class="depot" data-depot hidden><span>Déposez votre CV (PDF ou DOCX)</span></div>

</div>
<script type="module">
import { listerCv, supprimerCv, dupliquerCv, telechargerPdf } from "./cv-api.js";
import { MODELES, POLICES, ETAPES, afficherCv, sectionRemplie, normaliserContenu, echapper } from "./cv-rendu.js";
import { brancherImport } from "./cv-import.js";

const grille = document.querySelector("[data-grille]");
const zoneFiltres = document.querySelector("[data-filtres]");
const notification = document.querySelector("[data-notification]");
let cvs = [];
let filtre = "TOUS";
let minuteur;

const SECTIONS = ETAPES.slice(0, -1); // toutes les étapes sauf « Vérification »
const ICONE_OK = `<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/></svg>`;
const ICONE_CREER = `<svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>`;
const ICONE_IMPORTER = `<svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>`;

const formatDate = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });

function notifier(message) {
	notification.textContent = message;
	notification.hidden = false;
	clearTimeout(minuteur);
	minuteur = setTimeout(() => { notification.hidden = true; }, 4500);
}

// Sections remplies (même règle que la barre d'étapes de « Créer un CV ») ; chaque section manquante ouvre son étape.
function progression(cv, lienModifier) {
	const contenu = normaliserContenu(cv.contenu);
	const manquantes = SECTIONS.map((nom, etape) => ({ nom, etape })).filter(s => !sectionRemplie(contenu, s.etape));
	const remplies = SECTIONS.length - manquantes.length;
	const experiences = contenu.experiences.filter(e => e.poste?.trim()).length;
	const competences = contenu.competences.reduce((n, g) => n + g.elements.length, 0);
	const etat = manquantes.length
		? `<p class="etat-incomplet">À compléter : ${manquantes.map(s => `<a href="${lienModifier}&etape=${s.etape}">${s.nom}</a>`).join(", ")}</p>`
		: `<p class="etat-complet">${ICONE_OK}CV complet</p>`;
	return `<div class="progression">
<div class="progression-tete"><strong>${remplies}/${SECTIONS.length} sections remplies</strong><span>${experiences} exp. · ${competences} compétence${competences > 1 ? "s" : ""}</span></div>
<div class="barre" role="progressbar" aria-label="Sections remplies" aria-valuemin="0" aria-valuemax="${SECTIONS.length}" aria-valuenow="${remplies}"><span style="width:${Math.round(remplies / SECTIONS.length * 100)}%"></span></div>
${etat}</div>`;
}

function carte(cv) {
	const modele = MODELES[cv.modele]?.nom ?? cv.modele;
	const police = POLICES[cv.police]?.nom ?? cv.police;
	const lienModifier = `creer-cv.html?id=${cv.id}`;
	const titre = echapper(cv.titre);
	return `<article class="carte" data-id="${cv.id}">
<div class="carte-tete">
<div style="min-width:0"><h2>${titre}</h2><p class="date">Modifié le ${formatDate.format(new Date(cv.dateModification))}</p><p class="date" style="margin-top:2px">${echapper(modele)} · ${echapper(police)} · ${cv.langue === "EN" ? "Anglais" : "Français"}</p></div>
<div class="menu">
<button type="button" class="bouton-menu" aria-haspopup="true" aria-expanded="false" aria-label="Autres actions pour ${titre}" data-action="menu">&#8943;</button>
<div class="menu-liste" hidden>
<button type="button" data-action="dupliquer">Dupliquer</button>
<button type="button" class="danger" data-action="supprimer">Supprimer</button>
</div>
</div>
</div>
<a class="miniature" href="${lienModifier}" aria-label="Ouvrir le CV ${titre}"><div class="miniature-page" aria-hidden="true"><article></article></div></a>
${progression(cv, lienModifier)}
<div class="carte-actions">
<a class="bouton" href="${lienModifier}">Modifier</a>
<button type="button" class="bouton" data-action="pdf">Télécharger le PDF</button>
</div>
</article>`;
}

// Dernière carte de la grille : ajouter une autre version du CV.
function carteNouveau() {
	return `<div class="carte carte-nouveau">
<span class="icone">${ICONE_CREER}</span>
<h2 style="margin:0;font-size:19px;font-weight:700">Ajouter un CV</h2>
<p>Une autre version, par exemple en anglais ou pour un autre poste.</p>
<div class="actions-page"><a class="bouton bouton-bleu" href="creer-cv.html">Créer</a><button type="button" class="bouton" data-importer>Importer</button></div>
</div>`;
}

// Écran d'accueil quand il n'y a encore aucun CV : les deux façons de commencer.
function accueil() {
	return `<section class="accueil" style="grid-column:1/-1">
<div><h2>Vous n'avez pas encore de CV</h2><p>Partez de zéro avec le formulaire guidé, ou importez le CV que vous avez déjà.</p></div>
<div class="choix">
<div class="choix-carte"><span class="icone">${ICONE_CREER}</span><h3>Créer un CV</h3>
<p>Un formulaire guidé en ${SECTIONS.length + 1} étapes, avec l'aperçu en direct, trois modèles et cinq polices.</p>
<a class="bouton bouton-principal" href="creer-cv.html">Créer un CV</a></div>
<div class="choix-carte"><span class="icone">${ICONE_IMPORTER}</span><h3>Importer un CV</h3>
<p>Un fichier PDF ou DOCX de 5 Mo maximum. Vous pouvez aussi le glisser sur la page.</p>
<button type="button" class="bouton" data-importer>Importer un CV</button></div>
</div></section>`;
}

function ajusterMiniatures() {
	grille.querySelectorAll(".miniature").forEach(cadre => {
		const page = cadre.querySelector(".miniature-page");
		page.style.transform = `scale(${cadre.clientWidth / 794})`;
	});
}

function afficher() {
	const compte = langue => cvs.filter(cv => langue === "TOUS" || cv.langue === langue).length;
	zoneFiltres.innerHTML = [["TOUS", "Tous"], ["FR", "Français"], ["EN", "Anglais"]].map(([valeur, libelle]) =>
		`<button type="button" data-filtre="${valeur}" aria-pressed="${valeur === filtre}">${libelle} (${compte(valeur)})</button>`).join("");

	const visibles = cvs.filter(cv => filtre === "TOUS" || cv.langue === filtre);
	// Sans CV, l'écran d'accueil remplace les boutons du haut et les filtres.
	zoneFiltres.hidden = !cvs.length;
	document.querySelector("[data-actions-page]").hidden = !cvs.length;
	if (!cvs.length) {
		grille.innerHTML = accueil();
		return;
	}
	grille.innerHTML = visibles.map(carte).join("") + carteNouveau();
	visibles.forEach(cv => afficherCv(grille.querySelector(`[data-id="${cv.id}"] .miniature-page article`), cv));
	ajusterMiniatures();
}

async function charger() {
	cvs = await listerCv();
	afficher();
}

function fermerMenus(sauf) {
	grille.querySelectorAll(".menu-liste").forEach(liste => {
		if (liste === sauf) return;
		liste.hidden = true;
		liste.previousElementSibling.setAttribute("aria-expanded", "false");
		const suppression = liste.querySelector("[data-action=supprimer]");
		suppression.textContent = "Supprimer";
		delete suppression.dataset.confirmer;
	});
}

zoneFiltres.addEventListener("click", evenement => {
	const bouton = evenement.target.closest("[data-filtre]");
	if (!bouton) return;
	filtre = bouton.dataset.filtre;
	afficher();
});

grille.addEventListener("click", async evenement => {
	const bouton = evenement.target.closest("[data-action]");
	if (!bouton) return;
	const carteCv = bouton.closest("[data-id]");
	const id = Number(carteCv?.dataset.id);

	switch (bouton.dataset.action) {
		case "menu": {
			const liste = bouton.nextElementSibling;
			fermerMenus(liste);
			liste.hidden = !liste.hidden;
			bouton.setAttribute("aria-expanded", String(!liste.hidden));
			break;
		}
		case "dupliquer": {
			const copie = await dupliquerCv(id);
			notifier(`« ${copie.titre} » a été créé.`);
			await charger();
			break;
		}
		case "supprimer": {
			if (!bouton.dataset.confirmer) {
				bouton.dataset.confirmer = "oui";
				bouton.textContent = "Confirmer la suppression";
				return;
			}
			await supprimerCv(id);
			notifier("Le CV a été supprimé.");
			await charger();
			break;
		}
		case "pdf":
			try {
				await telechargerPdf(id);
			} catch (erreur) {
				notifier(erreur.message);
			}
			break;
	}
});

document.addEventListener("click", evenement => {
	if (!evenement.target.closest(".menu")) fermerMenus();
});
